apiVersion: apps/v1
kind: Deployment
metadata:
  name: lottery-deployment
  labels:
    app: lottery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lottery
  template:
    metadata:
      labels:
        app: lottery
    spec:
      containers:
        - name: lottery
          image: us-central1-docker.pkg.dev/durable-catbird-450018-j4/lottery/lottery-machine:54
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: PORT
              value: "8000"
            - name: PYTHONUNBUFFERED
              value: "1"
